  - &atlas age1lmn3ef3hj0q2wst7g588vftfl4na9jdhn430j6sd7wga69yvqq4qkkzz5s
  #   ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJOIiYU8XZu96RhYFrRz0yYNPEgH51M4cDx+ImXLzRx7 root@oxide-1
