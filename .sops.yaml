# Note: the first matching rule wins, so keep the specific rules above the
# catch-all for the repository-level `.secrets.yaml`.
creation_rules:
  # The bearer token the build agents authenticate to the queue runner with.
  # One static token shared by all of them, so it is readable by the Hydra
  # host and by every agent.
  - path_regex: ^secrets-queue-runner\.yaml$
    key_groups:
    - age:
      - *htz1-01
      - *htz1-02
      - *htz1-03
      - *htz1-04
      - *oxi1-01
      - *oxi1-02
      - *brv1-01
      - *brv1-02
      - *brv1-03
      - *brv1-04
      - *brv1-05
      - *brv1-06
      - *brv1-07
      - *brv1-08
      - *gaetan
      - *yuriy
  - path_regex: hosts/htz1-01/secrets-grafana\.yaml$
    key_groups:
    - age:
      - *htz1-01
      - *gaetan
      - *serge
      - *yuriy
  - path_regex: hosts/htz1-01/secrets\.yaml$
    key_groups:
    - age:
      - *htz1-01
      - *gaetan
      - *yuriy
  - path_regex: ^\.secrets\.yaml$
    key_groups:
    - age:
      - *gaetan
      - *yuriy
